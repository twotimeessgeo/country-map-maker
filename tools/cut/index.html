<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade Cut Archive | Promenade Geography</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="../../ds/fonts.css?v=32" />
    <link rel="stylesheet" href="../../ds/tokens.css?v=32" />
    <link rel="stylesheet" href="../../ds/base.css?v=32" />
    <link rel="stylesheet" href="../../ds/components.css?v=32" />
    <link rel="stylesheet" href="../../ds/patterns.css?v=32" />
    <link rel="stylesheet" href="./cut.css?v=33" />
  </head>
  <body>
    <header class="tw-nav is-static">
      <nav class="tw-nav-inner" aria-label="Promenade Geography">
        <a class="tw-brand" href="../../index.html" aria-label="Promenade Geography home"><span lang="en">Promenade</span></a>
        <div class="tw-nav-links">
          <a class="tw-nav-link" lang="en" href="../climate/index.html">Climate Atlas</a>
          <a class="tw-nav-link" lang="en" href="./index.html" aria-current="page">Grade Cut Archive</a>
        </div>
        <span class="tw-nav-spacer"></span>
        <details class="tw-nav-menu">
          <summary aria-label="메뉴"><span class="tw-nav-menu-icon" aria-hidden="true"></span></summary>
          <div class="tw-nav-menu-panel">
            <a lang="en" href="../climate/index.html">Climate Atlas</a>
            <a lang="en" href="./index.html" aria-current="page">Grade Cut Archive</a>
          </div>
        </details>
      </nav>
    </header>

    <header class="tw-page tw-hero cut-hero">
      <h1 class="tw-display" lang="en">Grade Cut Archive</h1>
      <div class="cut-hero-meta">
        <nav id="subjectChips" class="tw-segmented" aria-label="과목"></nav>
        <span class="cut-record-count" id="recordCount" lang="en" aria-live="polite"></span>
      </div>
    </header>

    <div class="tw-subnav cut-toolbar">
      <div class="tw-subnav-inner cut-toolbar-inner">
        <div class="cut-filter-group"><span class="cut-filter-label">학년도</span><div id="yearChips" class="cut-chip-row" role="group" aria-label="학년도"></div></div>
        <div class="cut-filter-group"><span class="cut-filter-label">시험</span><div id="examChips" class="cut-chip-row" role="group" aria-label="시험"></div></div>
      </div>
    </div>

    <main class="tw-page cut-page">
      <form id="cutLookupForm" class="tw-sr-only" aria-label="시험 선택">
        <label>과목<select id="subjectSelect" name="subject"><option value="한국지리">한국지리</option><option value="세계지리">세계지리</option></select></label>
        <label>학년도<select id="yearSelect" name="year"></select></label>
        <label>시험<select id="examSelect" name="exam"></select></label>
      </form>
      <p class="tw-sr-only cut-status" id="lookupStatus" role="status">자료 준비 중</p>

      <section class="tw-section cut-result-panel" aria-labelledby="resultTitle">
        <div class="tw-section-head cut-result-heading">
          <div><p class="cut-result-subject" id="resultSubject">-</p><h2 id="resultTitle">등급컷</h2></div>
        </div>
        <div class="tw-card cut-result-card">
          <div class="tw-table-wrap cut-grade-wrap">
            <table class="tw-table cut-grade-table">
              <thead><tr><th scope="col">등급</th><th scope="col">원점수</th><th scope="col">표준점수</th><th scope="col">백분위</th></tr></thead>
              <tbody class="cut-grade-grid" id="gradeCutGrid" aria-live="polite"></tbody>
            </table>
          </div>
          <dl class="tw-meta-list cut-exam-meta" id="examMeta">
            <div><dt>평균</dt><dd id="meanValue">-</dd></div>
            <div><dt>표준편차</dt><dd id="sdValue">-</dd></div>
            <div><dt>시행 연도</dt><dd id="examYearValue">-</dd></div>
          </dl>
        </div>
      </section>

      <section class="tw-section cut-question-panel" aria-labelledby="questionAnalysisTitle">
        <div class="tw-section-head cut-question-heading"><h2 id="questionAnalysisTitle">문항 분석</h2><span id="questionAnalysisCount" class="tw-meta-list" aria-live="polite">0문항</span></div>
        <div class="cut-question-grid" id="questionAnalysisGrid"></div>
      </section>

      <section class="tw-section cut-history-panel" aria-labelledby="historyTitle">
        <div class="tw-section-head cut-history-heading"><h2 id="historyTitle">전체 기록</h2><span id="historyCount" aria-live="polite">0개 시험</span></div>
        <div class="tw-table-wrap cut-table-wrap">
          <table class="tw-table cut-history-table">
            <thead><tr><th scope="col">시험</th><th scope="col">1등급</th><th scope="col">2등급</th><th scope="col">3등급</th><th scope="col">평균</th></tr></thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="tw-footer"><div class="tw-footer-inner"><a id="sourceLink" href="https://www.ebsi.co.kr/ebs/xip/xipa/retrievePastGrdCutWrongAnswerRate.ebs?tab=1" target="_blank" rel="noreferrer" lang="en">EBSi</a></div></footer>
    <script src="./cut.js?v=33"></script>
  </body>
</html>
