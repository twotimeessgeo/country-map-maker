<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climate Atlas — Korea | Promenade Geography</title>
    <meta
      name="description"
      content="남북한 주요 지점의 1991–2020 월별 기온과 강수량을 비교하고 그래프로 확인합니다."
    />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="../../ds/fonts.css?v=32" />
    <link rel="stylesheet" href="../../ds/tokens.css?v=32" />
    <link rel="stylesheet" href="../../ds/base.css?v=32" />
    <link rel="stylesheet" href="../../ds/components.css?v=32" />
    <link rel="stylesheet" href="../../ds/patterns.css?v=32" />
    <link rel="stylesheet" href="styles.css?v=32" />
  </head>
  <body data-app-mode="korea">
    <header class="tw-nav is-static">
      <nav class="tw-nav-inner" aria-label="Promenade Geography">
        <a class="tw-brand" href="../../index.html" aria-label="Promenade Geography home">
          <span lang="en">Promenade</span>
        </a>
        <div class="tw-nav-links">
          <a class="tw-nav-link" lang="en" href="../../map.html">Map Editor</a>
          <a class="tw-nav-link" lang="en" href="./korea.html" aria-current="page">Climate Atlas</a>
          <a class="tw-nav-link" lang="en" href="../cut/index.html">Grade Cut Archive</a>
        </div>
        <span class="tw-nav-spacer"></span>
        <details class="tw-nav-menu">
          <summary aria-label="메뉴"><span class="tw-nav-menu-icon" aria-hidden="true"></span></summary>
          <div class="tw-nav-menu-panel">
            <a lang="en" href="../../map.html">Map Editor</a>
            <a lang="en" href="./korea.html" aria-current="page">Climate Atlas</a>
            <a lang="en" href="../cut/index.html">Grade Cut Archive</a>
          </div>
        </details>
      </nav>
    </header>

    <header class="tw-page tw-hero atlas-hero">
      <p class="tw-sr-only">
        <span id="heroCount">246개 지역</span>
        <span id="heroCaption" lang="en">KMA · 1991–2020</span>
      </p>
      <h1 class="tw-display" lang="en">Climate Atlas</h1>
      <nav class="tw-segmented app-switch" aria-label="지역 범위">
        <a class="app-switch-link" lang="en" href="./index.html">World</a>
        <a class="app-switch-link is-active" lang="en" href="./korea.html" aria-current="page">Korea</a>
      </nav>
    </header>

    <div class="tw-subnav atlas-toolbar">
      <div class="tw-subnav-inner">
        <nav class="tw-subnav-links" aria-label="페이지 구역">
          <a href="#select">지역 선택</a>
          <a href="#selectedPanel">기후 그래프</a>
          <a href="#comparisonPanel">비교</a>
        </nav>
        <div class="tw-subnav-actions atlas-actions" aria-label="선택 도구">
          <span class="atlas-count" id="selectionSummary" role="status" aria-live="polite" aria-atomic="true">0개 선택됨</span>
          <button type="button" class="tw-button is-ghost is-sm" id="randomSpacedSelectionButton">4곳 랜덤</button>
          <button type="button" class="tw-button is-ghost is-sm" id="clearSelectionButton">선택 해제</button>
          <button type="button" class="tw-button is-sm" id="downloadSelectedCsvButton" disabled>CSV</button>
          <button type="button" class="tw-button is-primary is-sm" id="copyShareLinkButton">링크 복사</button>
        </div>
      </div>
    </div>

    <main class="tw-page layout">
      <section class="tw-section atlas-select" id="select" aria-labelledby="selectTitle">
        <h2 class="tw-sr-only" id="selectTitle">지역 선택</h2>
        <div class="tw-workspace">
          <aside class="tw-sidebar picker" aria-label="지역 찾기">
            <div class="picker-search">
              <label class="tw-field" for="searchInput">
                <span class="tw-sr-only">지역 검색</span>
                <span class="tw-search">
                  <input
                    class="tw-input"
                    id="searchInput"
                    type="search"
                    placeholder="서울, 평양, 강릉, 함흥"
                    autocomplete="off"
                  />
                </span>
              </label>
              <label class="tw-field" for="regionSortSelect">
                <span class="tw-sr-only">정렬</span>
                <select class="tw-select" id="regionSortSelect">
                  <option value="default">기본순</option>
                  <option value="name">가나다순</option>
                  <option value="annualPrecipitationDesc">연 강수량 많은 순</option>
                  <option value="annualRangeDesc">연교차 큰 순</option>
                  <option value="warmestMonthDesc">최난월 기온 높은 순</option>
                  <option value="coldestMonthAsc">최한월 기온 낮은 순</option>
                </select>
              </label>
            </div>

            <div class="picker-list">
              <div class="region-list" id="regionList"></div>
            </div>
          </aside>

          <div class="tw-canvas">
            <div class="selected-tray-wrap">
              <div class="selected-tray" id="selectedTray" aria-label="선택한 지역"></div>
            </div>

            <div class="filter-bar" role="group" aria-label="필터">
              <div class="filter-group">
                <p class="filter-label">국가</p>
                <div class="chip-row" id="nationChips"></div>
              </div>
              <div class="filter-group">
                <p class="filter-label">권역</p>
                <div class="chip-row" id="zoneChips"></div>
              </div>
            </div>

            <article class="world-stage map-card">
              <div class="map-card-head">
                <span class="map-summary" id="mapSummary" role="status" aria-live="polite" aria-atomic="true" hidden>지도 준비 중</span>
                <div class="map-scope" id="mapScopeChips" role="group" aria-label="지도 표시 범위"></div>
              </div>
              <div id="worldMap"></div>
              <div
                class="map-candidate-picker"
                id="mapCandidatePicker"
                role="region"
                aria-label="지도 주변 지점 선택"
                aria-live="polite"
                hidden
              ></div>
            </article>

          </div>
        </div>
      </section>

      <section class="tw-section" id="selectedPanel" aria-labelledby="chartsTitle">
        <div class="tw-section-head">
          <div>
            <h2 id="chartsTitle">기후 그래프</h2>
          </div>
        </div>
        <div id="selectedRegionsContent" class="selected-grid"></div>
      </section>

      <section class="tw-section comparison-panel" id="comparisonPanel" aria-labelledby="comparisonTitle">
        <div class="tw-section-head">
          <div>
            <h2 id="comparisonTitle">비교</h2>
          </div>
        </div>
        <div id="comparisonContent"></div>
      </section>
    </main>

    <footer class="tw-footer">
      <div class="tw-footer-inner">
        <span class="tw-latin">Promenade Geography</span>
      </div>
    </footer>

    <div class="tw-toast selection-utility-status" id="selectionUtilityStatus" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="data/korea-climate-data.js?v=20260716"></script>
    <script src="data/korea-peninsula-geo.js"></script>
    <script src="data/vendor-d3.min.js"></script>
    <script src="chart-kit.js?v=32"></script>
    <script src="comparison-kit.js?v=32"></script>
    <script src="map-zoom.js?v=32"></script>
    <script src="korea-app.js?v=32"></script>
  </body>
</html>
