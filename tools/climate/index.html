<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Climate Atlas — World | Promenade Geography</title>
    <meta
      name="description"
      content="세계 주요 지역의 1991–2020 월별 기온과 강수량을 비교하고 그래프로 확인합니다."
    />
    <meta name="theme-color" content="#111111" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="styles.css?v=20260710h" />
  </head>
  <body data-app-mode="world">
    <div class="page-shell">
      <nav class="app-context-bar" aria-label="Promenade Geography">
        <a class="app-context-brand" href="../../index.html" aria-label="Promenade Geography home">
          <span>Promenade</span>
        </a>
        <details class="app-context-menu">
          <summary>
            <span class="app-menu-mark" aria-hidden="true"></span>
            <span>Menu</span>
          </summary>
          <div class="app-context-menu-panel">
            <a href="../../map.html">Map Editor</a>
            <a class="is-active" href="./index.html">Climate Atlas</a>
            <a href="../cut/index.html">Grade Cut Archive</a>
          </div>
        </details>
      </nav>
      <header class="hero">
        <div class="hero-copy">
          <h1 lang="en">Climate Atlas</h1>
          <nav class="app-switch" aria-label="지역 범위">
            <a class="app-switch-link is-active" lang="en" href="./index.html">World</a>
            <a class="app-switch-link" lang="en" href="./korea.html">Korea</a>
          </nav>
        </div>
        <div class="hero-note">
          <strong id="heroCount">129개 지역</strong>
          <span id="heroCaption" lang="en">JMA · 1991–2020</span>
        </div>
      </header>

      <main class="layout">
        <section class="panel controls-panel">
          <div class="section-heading">
            <div>
              <h2>지역 선택</h2>
            </div>
            <div class="selection-summary" id="selectionSummary" role="status" aria-live="polite" aria-atomic="true">0개 선택됨</div>
          </div>

          <div class="control-bar has-sort">
            <label class="search-field" for="searchInput">
              <span>지역 검색</span>
              <input
                id="searchInput"
                type="search"
                placeholder="예: 케이프타운, 파리, Aw"
                autocomplete="off"
              />
            </label>
            <label class="search-field sort-field" for="regionSortSelect">
              <span>지역 정렬</span>
              <select id="regionSortSelect">
                <option value="default">기본순</option>
                <option value="name">가나다순</option>
                <option value="annualPrecipitationDesc">연 강수량 많은 순</option>
                <option value="annualRangeDesc">연교차 큰 순</option>
                <option value="warmestMonthDesc">최난월 기온 높은 순</option>
                <option value="coldestMonthAsc">최한월 기온 낮은 순</option>
              </select>
            </label>
            <div class="action-row">
              <button type="button" class="ghost-button" id="randomClimateSelectionButton">
                4곳 랜덤
              </button>
              <button type="button" class="ghost-button" id="clearSelectionButton">선택 해제</button>
            </div>
          </div>

          <div class="selection-utility-bar" aria-label="선택 결과 내보내기">
            <div class="selection-utility-actions">
              <button type="button" class="ghost-button" id="downloadSelectedCsvButton" disabled>
                CSV
              </button>
              <button type="button" class="ghost-button utility-primary-button" id="copyShareLinkButton">
                링크 복사
              </button>
            </div>
            <span class="selection-utility-status" id="selectionUtilityStatus" role="status" aria-live="polite" aria-atomic="true"></span>
          </div>

          <div class="filter-stack">
            <div class="filter-group">
              <p class="filter-label">대륙</p>
              <div class="chip-row" id="continentChips"></div>
            </div>
            <div class="filter-group">
              <p class="filter-label">반구</p>
              <div class="chip-row" id="hemisphereChips"></div>
            </div>
            <div class="filter-group">
              <p class="filter-label">기후</p>
              <div class="chip-row" id="climateChips"></div>
            </div>
          </div>

          <div class="explore-grid">
            <article class="world-stage">
              <div class="section-heading compact nested-heading">
                <div>
                  <h2>지도</h2>
                </div>
                <div class="selection-summary is-muted" id="mapSummary" role="status" aria-live="polite" aria-atomic="true" hidden>지도 준비 중</div>
              </div>
              <div class="map-toolbar">
                <div class="filter-group">
                  <p class="filter-label">표시</p>
                  <div class="chip-row" id="mapScopeChips"></div>
                </div>
              </div>
              <div id="worldMap"></div>
            </article>

            <article class="region-picker">
              <details class="region-picker-details" open>
                <summary class="region-picker-summary">
                  <div class="section-heading compact nested-heading">
                    <div>
                      <h2>지역 목록</h2>
                    </div>
                  </div>
                </summary>
                <div class="region-list" id="regionList"></div>
              </details>
            </article>

            <article class="api-stage">
              <div class="section-heading compact nested-heading">
                <div>
                  <h2>지역 추가</h2>
                </div>
                <div class="selection-summary is-muted" id="apiStatusSummary" role="status" aria-live="polite" aria-atomic="true" hidden>
                  JMA 기본 자료 + 온라인 검색
                </div>
              </div>
              <div class="control-bar api-control-bar">
                <label class="search-field" for="apiSearchInput">
                  <span>도시·지역</span>
                  <input
                    id="apiSearchInput"
                    type="search"
                    placeholder="예: 뉴델리, 시드니, 마드리드"
                    autocomplete="off"
                  />
                </label>
                <div class="action-row">
                  <button type="button" class="ghost-button" id="apiSearchButton">검색</button>
                  <button type="button" class="ghost-button" id="resetCustomRegionsButton" disabled>
                    추가 지역 없음
                  </button>
                </div>
              </div>
              <p class="map-note" id="apiStatusText">
                JMA 미수록 지역은 Open-Meteo 1991-2020으로 보완합니다.
              </p>
              <div class="api-results" id="apiResults"></div>
            </article>
          </div>
        </section>

        <section class="panel" id="selectedPanel">
          <div class="section-heading">
            <div>
              <h2>기후 그래프</h2>
            </div>
          </div>
          <div id="selectedRegionsContent" class="selected-grid"></div>
        </section>

        <section class="panel comparison-panel" id="comparisonPanel">
          <div class="section-heading">
            <div>
              <h2>비교</h2>
            </div>
          </div>
          <div id="comparisonContent"></div>
        </section>
      </main>
    </div>

    <script src="data/climate-data.js?v=20260703-jma"></script>
    <script src="data/exam-climate-statements.js"></script>
    <script src="data/world-countries-50m.js"></script>
    <script src="data/vendor-d3.min.js"></script>
    <script src="data/vendor-topojson-client.min.js"></script>
    <script src="app.js?v=20260710h"></script>
  </body>
</html>
